<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Off The Records project preview</title>
  <desc id="desc">A retro mobile message board with colorful unsent letters.</desc>
  <rect width="1280" height="720" fill="#eef2f4"/>
  <rect x="96" y="54" width="1088" height="612" rx="18" fill="#fff" stroke="#6d8798" stroke-width="3"/>
  <rect x="96" y="54" width="1088" height="76" rx="18" fill="#f8fafb"/>
  <path d="M96 112h1088" stroke="#d7dee3" stroke-width="3"/>
  <g fill="#1a2833">
    <rect x="132" y="78" width="8" height="20"/>
    <rect x="145" y="73" width="8" height="25"/>
    <rect x="158" y="67" width="8" height="31"/>
    <path d="M186 80a22 22 0 0 1 32 0l-5 5a15 15 0 0 0-22 0zm8 8a11 11 0 0 1 16 0l-8 8z"/>
  </g>
  <text x="640" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1a2833">Off The Records</text>
  <text x="1140" y="94" text-anchor="end" font-family="Arial, sans-serif" font-size="19" fill="#5c7384">12:24</text>
  <text x="142" y="176" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#1a2833">보내지 못한 편지들</text>
  <text x="142" y="211" font-family="Arial, sans-serif" font-size="17" fill="#5c7384">끝내 전하지 못한 말을 한 화면에 남겨 두는 공간</text>
  <rect x="142" y="244" width="996" height="54" fill="#fff" stroke="#6d8798" stroke-width="2"/>
  <text x="166" y="278" font-family="Arial, sans-serif" font-size="18" fill="#7d93a3">이름으로 편지 찾기</text>
  <rect x="142" y="330" width="304" height="240" fill="#fff0a8" stroke="#b7a35c" stroke-width="2"/>
  <rect x="488" y="330" width="304" height="240" fill="#ffd8e3" stroke="#bd8292" stroke-width="2"/>
  <rect x="834" y="330" width="304" height="240" fill="#cef2df" stroke="#76a98d" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#1a2833">
    <text x="166" y="372" font-size="18" font-weight="700">TO. 오래된 우리에게</text>
    <text x="166" y="418" font-size="24">그때 하지 못한 말을</text>
    <text x="166" y="453" font-size="24">이제야 남겨.</text>
    <text x="166" y="535" font-size="16">보관 · 공유</text>
    <text x="512" y="372" font-size="18" font-weight="700">TO. 나의 봄에게</text>
    <text x="512" y="418" font-size="24">아직도 가끔은</text>
    <text x="512" y="453" font-size="24">그 계절을 생각해.</text>
    <text x="512" y="535" font-size="16">보관 · 공유</text>
    <text x="858" y="372" font-size="18" font-weight="700">TO. 미래의 나에게</text>
    <text x="858" y="418" font-size="24">천천히 가도 괜찮아.</text>
    <text x="858" y="453" font-size="24">잘하고 있어.</text>
    <text x="858" y="535" font-size="16">보관 · 공유</text>
  </g>
  <rect x="96" y="600" width="1088" height="66" rx="0" fill="#fff"/>
  <path d="M96 600h1088" stroke="#d7dee3" stroke-width="3"/>
  <rect x="132" y="615" width="124" height="34" fill="#efd06a"/>
  <text x="194" y="639" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1a2833">편지 쓰기</text>
  <text x="1118" y="639" text-anchor="end" font-family="Arial, sans-serif" font-size="18" fill="#1a2833">Instagram</text>
</svg>
