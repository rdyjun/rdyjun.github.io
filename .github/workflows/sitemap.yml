name: Update generated files

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'project.html'
      - 'article.html'
      - 'articles/**'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate sitemap.xml
        run: node scripts/generate-sitemap.mjs

      - name: Generate articles-data.js
        run: node scripts/generate-excerpts.mjs

      - name: Commit generated files if changed
        run: |
          if ! git diff --quiet -- sitemap.xml articles-data.js; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml articles-data.js
            git commit -m "chore: update generated files"
            git push
          fi
